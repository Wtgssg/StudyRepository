<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>认证中心登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background: white;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 380px;
            text-align: center;
        }
        .login-container h2 {
            margin-bottom: 8px;
            color: #1a1a2e;
        }
        .login-container .sub {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .login-container input[type="text"],
        .login-container input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            margin: 8px 0 16px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            background: #fafafa;
            transition: 0.2s;
        }
        .login-container input:focus {
            outline: none;
            border-color: #4a6cf7;
            background: white;
        }
        .login-container button {
            width: 100%;
            padding: 12px;
            background: #4a6cf7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }
        .login-container button:hover {
            background: #3a56d4;
        }
        .login-container .tip {
            margin-top: 16px;
            font-size: 13px;
            color: #aaa;
        }
    </style>
</head>
<body>
<div class="login-container">
    <h2>🔐 统一认证中心</h2>
    <p class="sub">输入账号密码完成登录</p>
    <form action="/doLogin" method="post">
        <input type="text" name="username" placeholder="用户名"  />
        <input type="password" name="password" placeholder="密码"  />
        <input type="hidden" name="returnUrl" th:value="${returnUrl}" />
        <button type="submit">登 录</button>
    </form>
</div>
</body>
</html>

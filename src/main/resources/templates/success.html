<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录成功</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: white;
            padding: 48px 56px;
            border-radius: 16px;
            text-align: center;
        }
        .card .user { color: #4a6cf7; font-weight: 600; }
        .card .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 28px;
            background: #4a6cf7;
            color: white;
            border-radius: 8px;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>✅ 登录成功</h1>
    <p>用户 <span class="user" th:text="${username}"></span> 已认证</p>
    <a class="btn" href="/home">成功进入oracle系统</a>
</div>
</body>
</html>

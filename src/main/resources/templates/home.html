<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>首页</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: white;
            padding: 48px 56px;
            border-radius: 16px;
            text-align: center;
        }
        .card .user { color: #4a6cf7; font-weight: 600; }
        .card a { color: #4a6cf7; text-decoration: none; }
    </style>
</head>
<body>
<div class="card">
    <h1>🏠 首页</h1>
    <p>欢迎，<span class="user" th:text="${username}"></span>！</p>
    <a href="/logout">退出</a>
</div>
</body>
</html>
